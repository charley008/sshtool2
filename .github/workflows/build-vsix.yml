name: Build and Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build extension package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Test built extension
        run: node scripts/test-extension.js --bundle

      - name: Package VSIX
        run: npm run package

      - name: Locate VSIX
        id: vsix
        shell: bash
        run: |
          file="packages/sshtools2-${GITHUB_REF_NAME}.vsix"
          if [ ! -f "$file" ]; then file="packages/sshtools2-$(node -p 'require("./package.json").version').vsix"; fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "Built $file"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshtools2-vsix
          path: ${{ steps.vsix.outputs.file }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          VSIX_FILE: ${{ steps.vsix.outputs.file }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$VSIX_FILE" --clobber
          else
            gh release create "$TAG_NAME" "$VSIX_FILE" --title "$TAG_NAME" --generate-notes
          fi
